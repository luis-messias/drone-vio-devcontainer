services:
  sensor_fusion:
    build: .
    image: drone-vio-devcontainer:dev
    container_name: drone-vio-devcontainer-${INSTANCE:-0}
    stdin_open: true
    tty: true
    environment:
      ROS_DOMAIN_ID: ${DRONE_ID:-1}
      ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1
    volumes:
      - ros2_workspace:/workspace
      - ${ROS2_PACKAGES_HOST_PATH:-../ros2-packages}:/workspace/src:cached
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /workspace
    networks:
      # AAS uses the second octet offset by INSTANCE; if you run with
      # INSTANCE != 0 update FUSION_HOST_IP to 10.42.<90+INSTANCE>.200.
      aas_sim:
        ipv4_address: ${FUSION_HOST_IP:-10.42.90.200}
    gpus: all

volumes:
  ros2_workspace:

networks:
  aas_sim:
    name: ${SIM_NETWORK_NAME:-aas-sim-network-inst0}
    external: true
